[project]
name = "dota-chat-translator"
version = "0.3.0"
description = "Personal Windows Dota chat translator with local GSI diagnostics"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "openai>=3.35,<4", "python-dotenv>=1,<2", "lingua-language-detector>=2,<3"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[tool.unittest]
start-directory = "tests"
